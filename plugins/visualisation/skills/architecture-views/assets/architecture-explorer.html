<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture explorer</title>

    window.__architectureDependencyErrors = [];
    // Set the resolved theme before first paint so dark-preference users get no light flash.
    document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.2/dist/cytoscape.min.js" onerror="window.__architectureDependencyErrors.push('Cytoscape.js')"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js" onerror="window.__architectureDependencyErrors.push('Mermaid')"></script>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3efe5;
      --paper-raised: #fffdf7;
      --ink: #1d2926;
      --muted: #66736e;
      --line: #c7c8bb;
      --line-strong: #829089;
      --accent: #086f63;
      --accent-soft: #d7eae4;
      --observed: #287f6e;
      --documented: #426ba8;
      --inferred: #a26712;
      --conflict: #b83b35;
      --added: #19724f;
      --modified: #a86408;
      --removed: #b83b35;
      --unchanged: #78837e;
      --unchanged-text: #56615c;
      --shadow: 0 1px 2px rgba(33, 44, 40, .05), 0 16px 42px rgba(33, 44, 40, .09);
      --grid-line: rgba(90, 108, 99, .055);
      --panel-shadow: -1px 0 0 var(--line);
      --display: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
      --body: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "Cascadia Code", Consolas, monospace;
    }

    /* The dark palette is defined once here; JavaScript resolves auto mode to a concrete data-theme value. */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #111816;
      --paper-raised: #18211e;
      --ink: #edf3ed;
      --muted: #a5b2ac;
      --line: #36423d;
      --line-strong: #74817b;
      --accent: #65c5b1;
      --accent-soft: #213d36;
      --observed: #65c5b1;
      --documented: #89ace2;
      --inferred: #e2af5f;
      --conflict: #ef837c;
      --added: #60c696;
      --modified: #e3ad56;
      --removed: #ef837c;
      --unchanged: #94a19b;
      --unchanged-text: #b5c0ba;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 20px 48px rgba(0, 0, 0, .38);
      --grid-line: rgba(178, 199, 189, .055);
      --panel-shadow: -1px 0 0 var(--line);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      color: var(--ink);
      font-family: var(--body);
    }
    button, input, select { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 70%, transparent);
      outline-offset: 2px;
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    .shell { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }
    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper-raised) 92%, transparent);
      backdrop-filter: blur(14px);
    }
    .eyebrow {
      margin: 0 0 4px;
      color: var(--accent);
      font: 700 11px/1.2 var(--mono);
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font: 700 clamp(23px, 2.4vw, 35px)/1.02 var(--display); letter-spacing: -.015em; }
    h1::before { content: "> "; color: var(--accent); }
    .question { max-width: 68ch; margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; font-style: italic; }
    .prototype-stamp {
      display: grid;
      gap: 5px;
      justify-items: end;
      color: var(--muted);
      font: 650 10px/1.2 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .stamp-box { padding: 6px 9px; border: 1px solid var(--inferred); color: var(--inferred); font-style: italic; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      min-width: 0;
      gap: 8px;
      align-items: center;
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--paper-raised);
    }
    .tabs { display: flex; gap: 3px; min-width: 0; flex-shrink: 0; }
    .tab, .tool {
      min-height: 34px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .tab { padding: 7px 11px; font-weight: 700; }
    .tab:hover, .tool:hover { background: var(--accent-soft); color: var(--ink); }
    .tab[aria-selected="true"] { background: var(--ink); color: var(--paper-raised); }
    .separator { width: 1px; align-self: stretch; margin: 0 2px; background: var(--line); }
    .eyebrow { font-family: var(--body); letter-spacing: .22em; }
    .tab, .tool, #search, select, .details-action, .participant, .badge, .legend-mark, .coordinate { border-radius: 3px; }
    .tab[aria-selected="true"] { background: var(--ink); color: var(--paper-raised); }
    .details h2 { font-style: italic; font-weight: 500; }
    .details h3 { font-family: var(--body); letter-spacing: .16em; }
    .evidence-card { border-left: 2px solid var(--accent); background: transparent; }
    .source-link { font-family: var(--mono); }
    #graph { background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--accent-soft) 32%, transparent), transparent 50%); }
    .search-wrap { position: relative; min-width: 150px; max-width: 300px; flex: 1; }
    .search-wrap::before { content: "⌕"; position: absolute; left: 10px; top: 7px; color: var(--muted); }
    #search {
      width: 100%; height: 34px; padding: 6px 70px 6px 29px;
      border: 1px solid var(--line); border-radius: 7px;
      background: var(--paper); color: var(--ink);
    }
    #search-count { position: absolute; right: 9px; top: 9px; color: var(--muted); font: 600 10px var(--mono); }
    .layout-control { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font: 650 10px var(--mono); white-space: nowrap; }
    .layout-control select { min-width: 92px; }
    select, .tool {
      height: 34px; padding: 6px 9px; border: 1px solid var(--line);
      background: var(--paper); color: var(--ink);
    }
    .tool { font-weight: 650; }
    button:disabled, input:disabled, select:disabled { opacity: .42; cursor: not-allowed; }

    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
    .canvas-column { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .view-meta {
      display: flex; align-items: center; gap: 10px; min-height: 38px;
      padding: 7px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px;
    }
    .coordinate { padding: 3px 7px; border: 1px solid var(--line); border-radius: 999px; font: 650 10px var(--mono); }
    .scenario { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .comparison-range { margin-left: auto; overflow: hidden; color: var(--ink); font: 650 10px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .canvas { position: relative; min-height: 0; overflow: hidden; }
    #graph, #sequence { position: absolute; inset: 0; }
    #graph { background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--accent-soft) 35%, transparent), transparent 48%); }
    #sequence { overflow: auto; padding: 28px 5%; }
    #sequence svg { min-width: 850px; max-width: none !important; height: auto; }
    .participant-strip { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 18px; }
    .participant { padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper-raised); color: var(--ink); cursor: pointer; }
    .participant.search-match { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); font-weight: 700; }
    .participant.dimmed { opacity: .45; }
    .sequence-fallback { max-width: 860px; margin: 0 auto; padding: 20px; border: 1px solid var(--conflict); background: var(--paper-raised); box-shadow: var(--shadow); }
    .sequence-fallback h2 { margin: 0 0 8px; color: var(--conflict); font: 600 22px/1.1 var(--display); }
    .sequence-fallback p, .sequence-fallback li { font-size: 13px; line-height: 1.5; }
    .sequence-fallback details { margin-top: 14px; }
    .sequence-fallback summary { cursor: pointer; color: var(--accent); font-weight: 700; }
    .sequence-fallback pre { max-height: 220px; overflow: auto; padding: 12px; background: var(--paper); color: var(--ink); font: 11px/1.5 var(--mono); white-space: pre-wrap; }
    .sequence-fallback .fallback-step { padding: 7px 0; border-bottom: 1px solid var(--line); }
    .sequence-fallback .fallback-step:last-child { border-bottom: 0; }
    .sequence-fallback code { color: var(--accent); }
    .sequence-source { max-width: 860px; margin: 16px auto 0; color: var(--muted); }
    .sequence-source summary { cursor: pointer; color: var(--accent); font-weight: 700; }
    .sequence-source pre { max-height: 220px; overflow: auto; padding: 12px; background: var(--paper); color: var(--ink); font: 11px/1.5 var(--mono); white-space: pre-wrap; }

    .details {
      min-width: 0; overflow: auto; border-left: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper-raised) 96%, transparent);
      box-shadow: var(--panel-shadow);
    }
    .details-inner { padding: 20px 20px 36px; }
    .details-kicker { color: var(--accent); font: 700 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .details h2 { margin: 6px 0 5px; font: 600 25px/1.08 var(--display); }
    .details-id { color: var(--muted); font: 10px var(--mono); overflow-wrap: anywhere; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
    .badge { padding: 4px 7px; border: 1px solid currentColor; border-radius: 999px; font: 700 9px var(--mono); letter-spacing: .055em; text-transform: uppercase; }
    .badge.observed { color: var(--observed); }
    .badge.documented { color: var(--documented); }
    .badge.inferred { color: var(--inferred); border-style: dashed; }
    .badge.conflict { color: var(--conflict); border-style: double; border-width: 3px; }
    .badge.added { color: var(--added); }
    .badge.modified { color: var(--modified); }
    .badge.removed { color: var(--removed); border-style: dashed; }
    .badge.unchanged { color: var(--unchanged-text); }
    .details p, .details li { font-size: 13px; line-height: 1.52; }
    .details h3 { margin: 20px 0 7px; color: var(--muted); font: 700 10px var(--mono); letter-spacing: .09em; text-transform: uppercase; }
    .details ul { margin: 0; padding-left: 18px; }
    .evidence-list { display: grid; gap: 9px; }
    .evidence-card { padding: 10px; border-left: 3px solid var(--accent); background: var(--paper); }
    .source-link { display: block; color: var(--accent); font: 650 11px/1.4 var(--mono); overflow-wrap: anywhere; }
    .evidence-note { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .details-action { width: 100%; margin-top: 15px; padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--accent-soft); color: var(--ink); cursor: pointer; font-weight: 700; }
    code { font-family: var(--mono); font-size: .9em; }

    .footer {
      display: flex; justify-content: space-between; gap: 14px; align-items: center;
      min-height: 40px; padding: 7px 14px; border-top: 1px solid var(--line); background: var(--paper-raised);
    }
    #legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 10px; }
    .legend-item { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
    .legend-mark { width: 14px; height: 10px; border: 2px solid currentColor; border-radius: 3px; }
    .legend-mark.inferred { border-style: dashed; }
    .legend-mark.conflict { border-style: solid; border-width: 3px; }
    .legend-mark.added { background: var(--added); border-color: var(--added); }
    .legend-mark.modified { background: var(--modified); border-color: var(--modified); }
    .legend-mark.removed { border-color: var(--removed); border-style: dashed; }
    .legend-mark.unchanged { border-color: var(--unchanged); opacity: .65; }
    #status { color: var(--muted); font: 600 10px var(--mono); white-space: nowrap; }

    .failure {
      position: fixed; inset: 0; z-index: 20; display: none; place-items: center; padding: 30px;
      background: var(--paper);
    }
    .failure.visible { display: grid; }
    .failure-card { max-width: 680px; padding: 30px; border: 1px solid var(--conflict); background: var(--paper-raised); box-shadow: var(--shadow); }
    .failure-card h2 { margin: 0 0 9px; color: var(--conflict); font: 600 30px var(--display); }
    .failure-card p, .failure-card li { line-height: 1.55; }
    .failure-card a { color: var(--accent); }

    @media (max-width: 900px) {
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .details { position: absolute; right: 0; top: 0; bottom: 40px; width: min(340px, 88vw); z-index: 8; box-shadow: var(--shadow); }
      .toolbar { overflow-x: auto; }
      .prototype-stamp { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow" id="eyebrow">Architecture exploration · ephemeral evidence view</p>
        <h1 id="title">Loading architecture…</h1>
        <p class="question" id="question"></p>
      </div>
      <div class="prototype-stamp"><span class="stamp-box">Ephemeral view</span><span>Nothing here edits the model</span></div>
    </header>

    <nav class="toolbar" aria-label="Explorer controls">
      <div class="tabs" id="tabs" role="tablist" aria-label="Architecture perspectives"></div>
      <span class="separator" aria-hidden="true"></span>
      <label class="search-wrap"><span class="visually-hidden"></span><input id="search" type="search" placeholder="Search elements or evidence" aria-label="Search elements or evidence"><span id="search-count"></span></label>
      <select id="evidence-filter" aria-label="Filter by evidence state">
        <option value="all">All evidence</option>
        <option value="observed">Observed</option>
        <option value="documented">Documented</option>
        <option value="inferred">Inferred</option>
        <option value="conflict">Conflict</option>
      </select>
      <button class="tool" id="fit" type="button">Fit</button>
      <button class="tool" id="layout" type="button">Re-layout</button>
      <label class="layout-control">Direction<select id="layout-direction" aria-label="Layout direction"><option value="RIGHT">Right</option><option value="DOWN">Down</option></select></label>
      <label class="layout-control">Density<select id="layout-density" aria-label="Layout density"><option value="COMPACT">Compact</option><option value="BALANCED">Balanced</option><option value="SPACIOUS">Spacious</option></select></label>
      <label class="layout-control">Routing<select id="layout-routing" aria-label="Edge routing"><option value="ORTHOGONAL">Orthogonal</option><option value="STRAIGHT">Straight</option></select></label>
      <button class="tool" id="reset" type="button">Reset view</button>
      <button class="tool" id="theme" type="button">Theme: auto</button>
      <button class="tool" id="export" type="button" disabled>Export PNG</button>
    </nav>

    <section class="workspace">
      <div class="canvas-column">
        <div class="view-meta"><span class="coordinate" id="level"></span><span class="coordinate" id="perspective"></span><span class="scenario" id="scenario"></span><span class="comparison-range" id="comparison" hidden></span></div>
        <div class="canvas"><div id="graph"></div><div id="sequence" hidden></div></div>
      </div>
      <aside class="details" aria-live="polite"><div class="details-inner" id="details"></div></aside>
    </section>

    <footer class="footer"><div id="legend" aria-label="Diagram legend"></div><div id="status">Waiting for renderer…</div></footer>
  </main>

  <section class="failure" id="failure" role="alert"><div class="failure-card"><p class="eyebrow">Explorer unavailable</p><h2 id="failure-title">Dependencies did not load</h2><div id="failure-body"></div></div></section>
  <script type="text/plain" id="architecture-data">__ARCHITECTURE_DATA_BASE64__</script>

  <script defer>
  (() => {
    'use strict';

    const byId = id => document.getElementById(id);
    const escapeHtml = value => String(value ?? '').replace(/[&<>"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[character]));
    const stateMark = { observed: '●', documented: '◆', inferred: '?', conflict: '!' };
    const changeMark = { added: '+', modified: '~', removed: '−', unchanged: '·' };
    const changeLabel = { added: 'Added', modified: 'Modified', removed: 'Removed', unchanged: 'Context' };
    const kindMark = { Person: '◉', 'Data Store': '▱', Queue: '≋' };
    const layoutDirections = new Set(['RIGHT', 'DOWN']);
    const layoutDensities = new Set(['COMPACT', 'BALANCED', 'SPACIOUS']);
    const layoutRoutings = new Set(['ORTHOGONAL', 'STRAIGHT']);
    const layoutControls = [['layout-direction', 'direction'], ['layout-density', 'density'], ['layout-routing', 'routing']];
    let renderRevision = 0;
    let completedRevision = 0;
    let preflightErrors = [];
    let artifactFingerprint = null;

    function beginRender() {
      byId('export').disabled = true;
      return ++renderRevision;
    }

    function finishRender(revision) {
      if (revision !== renderRevision) return false;
      completedRevision = revision;
      byId('export').disabled = false;
      return true;
    }
    const state = { data: null, catalog: new Map(), relationships: new Map(), activeView: null, cy: null, selectedId: null, collapsed: new Set(), layoutOverrides: new Map(), complexityReports: new Map(), sequenceReports: new Map(), theme: 'auto', failure: null, exportRunId: `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`, exportCount: 0 };

    function displayName(item) { return item?.displayName || item?.name || item?.id || ''; }
    function displayLabel(relationship) { return relationship?.displayLabel || relationship?.label || relationship?.id || ''; }
    function fullName(item) { return item?.name || item?.id || ''; }
    function fullLabel(relationship) { return relationship?.label || relationship?.id || ''; }

    function fingerprint(value) {
      let hash = 2166136261;
      for (const character of String(value)) {
        hash ^= character.charCodeAt(0);
        hash = Math.imul(hash, 16777619);
      }
      return `fnv1a-${(hash >>> 0).toString(16).padStart(8, '0')}`;
    }

    function isTransition() { return Boolean(state.data?.comparison); }

    function showFailure(title, body, kind = 'runtime') {
      state.failure = { kind, title };
      byId('failure-title').textContent = title;
      byId('failure-body').innerHTML = body;
      byId('failure').classList.add('visible');
    }

    function decodeData() {
      const encoded = byId('architecture-data').textContent.trim();
      const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function validate(data) {
      const errors = [];
      const object = value => value && typeof value === 'object' && !Array.isArray(value);
      const allowed = (value, keys, path) => {
        if (!object(value)) return;
        for (const key of Object.keys(value)) if (!keys.has(key)) errors.push(`${path} has unknown field '${key}'.`);
      };
      const nonEmptyText = value => typeof value === 'string' && value.trim().length > 0;
      if (!object(data)) return ['The data root must be an object.'];
      allowed(data, new Set(['meta', 'comparison', 'catalog', 'relationships', 'views']), 'root');
      for (const key of ['catalog', 'relationships', 'views']) if (!Array.isArray(data[key])) errors.push(`${key} must be an array.`);
      if (errors.some(error => error.endsWith('must be an array.'))) return errors;
      if (!data.views.length) errors.push('views must contain at least one view.');

      allowed(data.meta, new Set(['title', 'question', 'repository', 'repositoryRoot', 'generatedAt', 'artifactId', 'primaryView']), 'meta');
      if (!object(data.meta) || !nonEmptyText(data.meta.title) || !nonEmptyText(data.meta.question) || !nonEmptyText(data.meta.repositoryRoot)) errors.push('meta requires non-empty title, question, and repositoryRoot strings.');
      if (object(data.meta) && data.meta.artifactId !== undefined && !nonEmptyText(data.meta.artifactId)) errors.push('meta.artifactId must be a non-empty string when present.');

      const transition = data.comparison !== undefined;
      if (transition) {
        allowed(data.comparison, new Set(['base', 'head', 'range']), 'comparison');
        if (!object(data.comparison) || !nonEmptyText(data.comparison.base) || !nonEmptyText(data.comparison.head)) errors.push('comparison requires non-empty base and head strings.');
        if (object(data.comparison) && data.comparison.range !== undefined && !nonEmptyText(data.comparison.range)) errors.push('comparison.range must be a non-empty string when present.');
      }

      const evidenceStates = new Set(['observed', 'documented', 'inferred', 'conflict']);
      const confidenceLevels = new Set(['high', 'medium', 'low']);
      const changeStates = new Set(['added', 'modified', 'removed', 'unchanged']);
      const emphases = new Set(['hero', 'muted']);
      const ids = new Set();
      const catalogById = new Map();
      data.catalog.forEach((item, index) => {
        const path = `catalog[${index}]`;
        allowed(item, new Set(['id', 'name', 'displayName', 'kind', 'evidenceState', 'confidence', 'evidence', 'technology', 'scope', 'description', 'responsibilities', 'changeState']), path);
        if (!object(item) || !nonEmptyText(item.id) || !nonEmptyText(item.name) || !nonEmptyText(item.kind)) errors.push(`${path} requires non-empty id, name, and kind strings.`);
        if (item?.displayName !== undefined && !nonEmptyText(item.displayName)) errors.push(`${path}.displayName must be a non-empty string when present.`);
        if (!evidenceStates.has(item?.evidenceState)) errors.push(`${path} has an invalid evidenceState.`);
        if (!confidenceLevels.has(item?.confidence)) errors.push(`${path} has an invalid confidence.`);
        if (!Array.isArray(item?.evidence)) errors.push(`${path}.evidence must be an array.`);
        else item.evidence.forEach((evidence, evidenceIndex) => {
          const evidencePath = `${path}.evidence[${evidenceIndex}]`;
          allowed(evidence, new Set(['path', 'line', 'note']), evidencePath);
          if (!object(evidence) || !nonEmptyText(evidence.path)) errors.push(`${evidencePath} requires a non-empty path string.`);
          if (evidence?.line !== undefined && (!Number.isInteger(evidence.line) || evidence.line < 1)) errors.push(`${evidencePath}.line must be a positive integer.`);
        });
        if (item?.responsibilities !== undefined && !Array.isArray(item.responsibilities)) errors.push(`${path}.responsibilities must be an array when present.`);
        if (item?.changeState !== undefined && !changeStates.has(item.changeState)) errors.push(`${path} has an invalid changeState.`);
        if (!transition && item?.changeState !== undefined) errors.push(`${path}.changeState requires a root comparison.`);
        if (ids.has(item?.id)) errors.push(`Duplicate catalog id: ${item.id}`);
        if (nonEmptyText(item?.id)) { ids.add(item.id); catalogById.set(item.id, item); }
      });

      const relationshipIds = new Set();
      const relationshipsById = new Map();
      data.relationships.forEach((relationship, index) => {
        const path = `relationships[${index}]`;
        allowed(relationship, new Set(['id', 'source', 'target', 'label', 'displayLabel', 'evidenceState', 'confidence', 'evidence', 'technology', 'explanation', 'changeState', 'emphasis']), path);
        if (!object(relationship) || !nonEmptyText(relationship.id) || !nonEmptyText(relationship.source) || !nonEmptyText(relationship.target) || !nonEmptyText(relationship.label)) errors.push(`${path} requires non-empty id, source, target, and label strings.`);
        if (relationship?.displayLabel !== undefined && !nonEmptyText(relationship.displayLabel)) errors.push(`${path}.displayLabel must be a non-empty string when present.`);
        if (!evidenceStates.has(relationship?.evidenceState)) errors.push(`${path} has an invalid evidenceState.`);
        if (!confidenceLevels.has(relationship?.confidence)) errors.push(`${path} has an invalid confidence.`);
        if (!Array.isArray(relationship?.evidence)) errors.push(`${path}.evidence must be an array.`);
        else relationship.evidence.forEach((evidence, evidenceIndex) => {
          const evidencePath = `${path}.evidence[${evidenceIndex}]`;
          allowed(evidence, new Set(['path', 'line', 'note']), evidencePath);
          if (!object(evidence) || !nonEmptyText(evidence.path)) errors.push(`${evidencePath} requires a non-empty path string.`);
          if (evidence?.line !== undefined && (!Number.isInteger(evidence.line) || evidence.line < 1)) errors.push(`${evidencePath}.line must be a positive integer.`);
        });
        if (!ids.has(relationship?.source) || !ids.has(relationship?.target)) errors.push(`Relationship ${relationship?.id || index} points to an unknown element.`);
        if (relationship?.changeState !== undefined && !changeStates.has(relationship.changeState)) errors.push(`${path} has an invalid changeState.`);
        if (!transition && relationship?.changeState !== undefined) errors.push(`${path}.changeState requires a root comparison.`);
        if (relationship?.emphasis !== undefined && !emphases.has(relationship.emphasis)) errors.push(`${path}.emphasis must be hero or muted.`);
        if (relationshipIds.has(relationship?.id)) errors.push(`Duplicate relationship id: ${relationship.id}`);
        if (nonEmptyText(relationship?.id)) { relationshipIds.add(relationship.id); relationshipsById.set(relationship.id, relationship); }
      });

      const viewIds = new Set();
      data.views.forEach((view, index) => {
        const path = `views[${index}]`;
        allowed(view, new Set(['id', 'label', 'level', 'perspective', 'scenario', 'renderer', 'direction', 'layout', 'backView', 'drilldowns', 'nodes', 'edges', 'participants', 'mermaid']), path);
        if (!object(view) || !nonEmptyText(view.id) || !nonEmptyText(view.label) || !nonEmptyText(view.level) || !nonEmptyText(view.perspective) || typeof view.scenario !== 'string' || !nonEmptyText(view.renderer)) errors.push(`${path} is incomplete.`);
        if (!['Logical', 'Process', 'Development', 'Physical'].includes(view?.perspective)) errors.push(`${path} has an invalid perspective.`);
        if (!['graph', 'sequence'].includes(view?.renderer)) errors.push(`${path} has an invalid renderer.`);
        if (viewIds.has(view?.id)) errors.push(`Duplicate view id: ${view.id}`);
        if (nonEmptyText(view?.id)) viewIds.add(view.id);
        if (view?.direction !== undefined && !layoutDirections.has(view.direction)) errors.push(`${path}.direction must be RIGHT or DOWN.`);
        if (view?.layout !== undefined) {
          allowed(view.layout, new Set(['direction', 'density', 'routing']), `${path}.layout`);
          if (!object(view.layout)) errors.push(`${path}.layout must be an object when present.`);
          else {
            if (view.layout.direction !== undefined && !layoutDirections.has(view.layout.direction)) errors.push(`${path}.layout.direction must be RIGHT or DOWN.`);
            if (view.layout.density !== undefined && !layoutDensities.has(view.layout.density)) errors.push(`${path}.layout.density must be COMPACT, BALANCED, or SPACIOUS.`);
            if (view.layout.routing !== undefined && !layoutRoutings.has(view.layout.routing)) errors.push(`${path}.layout.routing must be ORTHOGONAL or STRAIGHT.`);
          }
        }
        if (view?.backView !== undefined && !nonEmptyText(view.backView)) errors.push(`${path}.backView must be a non-empty view id when present.`);
        if (view?.drilldowns !== undefined) {
          if (!Array.isArray(view.drilldowns)) errors.push(`${path}.drilldowns must be an array when present.`);
          else view.drilldowns.forEach((drilldown, drilldownIndex) => {
            const drilldownPath = `${path}.drilldowns[${drilldownIndex}]`;
            allowed(drilldown, new Set(['element', 'targetView', 'label']), drilldownPath);
            if (!object(drilldown) || !nonEmptyText(drilldown.element) || !nonEmptyText(drilldown.targetView)) errors.push(`${drilldownPath} requires element and targetView strings.`);
            if (drilldown?.label !== undefined && !nonEmptyText(drilldown.label)) errors.push(`${drilldownPath}.label must be non-empty when present.`);
          });
        }

        if (view?.renderer === 'graph') {
          if (!Array.isArray(view.nodes) || !Array.isArray(view.edges)) { errors.push(`Graph view ${view.id} requires nodes and edges arrays.`); return; }
          const nodeIds = new Set();
          view.nodes.forEach((node, nodeIndex) => {
            allowed(node, new Set(['id', 'parent']), `${path}.nodes[${nodeIndex}]`);
            if (!object(node) || !nonEmptyText(node.id)) errors.push(`${path}.nodes[${nodeIndex}] requires an id.`);
            if (!ids.has(node?.id)) errors.push(`View ${view.id} references unknown node ${node?.id}.`);
            if (nodeIds.has(node?.id)) errors.push(`View ${view.id} includes duplicate node ${node.id}.`);
            if (nonEmptyText(node?.id)) nodeIds.add(node.id);
          });
          view.nodes.forEach(node => {
            if (node?.parent && !nodeIds.has(node.parent)) errors.push(`View ${view.id} parent ${node.parent} must also appear in the view.`);
            if (transition && catalogById.has(node?.id) && !changeStates.has(catalogById.get(node.id).changeState)) errors.push(`Transition view ${view.id} node ${node.id} requires changeState.`);
          });
          const visiting = new Set();
          const visited = new Set();
          const visit = id => {
            if (visiting.has(id)) { errors.push(`View ${view.id} contains a compound-parent cycle at ${id}.`); return; }
            if (visited.has(id)) return;
            visiting.add(id);
            const parent = view.nodes.find(node => node?.id === id)?.parent;
            if (parent && nodeIds.has(parent)) visit(parent);
            visiting.delete(id);
            visited.add(id);
          };
          view.nodes.forEach(node => { if (node?.id) visit(node.id); });
          const edgeIds = new Set();
          view.edges.forEach(id => {
            if (edgeIds.has(id)) errors.push(`View ${view.id} includes duplicate relationship ${id}.`);
            edgeIds.add(id);
            if (!relationshipIds.has(id)) { errors.push(`View ${view.id} references unknown relationship ${id}.`); return; }
            const relationship = relationshipsById.get(id);
            if (!nodeIds.has(relationship.source) || !nodeIds.has(relationship.target)) errors.push(`View ${view.id} relationship ${id} requires both endpoints in the view.`);
            if (transition && !changeStates.has(relationship.changeState)) errors.push(`Transition view ${view.id} relationship ${id} requires changeState.`);
          });
          const heroCount = view.edges.filter(id => relationshipsById.get(id)?.emphasis === 'hero').length;
          if (heroCount > 1) errors.push(`Graph view ${view.id} may contain at most one hero relationship.`);
          if (transition && view.edges.length) {
            if (heroCount !== 1) errors.push(`Transition graph view ${view.id} requires exactly one hero relationship when it has edges.`);
          }
        }

        if (view?.renderer === 'sequence') {
          if (!Array.isArray(view.participants) || !view.participants.length || typeof view.mermaid !== 'string' || !view.mermaid.trim()) { errors.push(`Sequence view ${view.id} requires a non-empty participants array and mermaid source.`); return; }
          const participants = new Set();
          view.participants.forEach(id => {
            if (!ids.has(id)) errors.push(`View ${view.id} references unknown participant ${id}.`);
            if (participants.has(id)) errors.push(`View ${view.id} includes duplicate participant ${id}.`);
            participants.add(id);
          });
        }
      });

      if (data.meta?.primaryView !== undefined && !viewIds.has(data.meta.primaryView)) errors.push(`meta.primaryView must reference an existing view.`);
      data.views.forEach((view, index) => {
        const path = `views[${index}]`;
        if (!object(view)) return;
        if (view.backView !== undefined && !viewIds.has(view.backView)) errors.push(`${path}.backView must reference an existing view.`);
        (Array.isArray(view.drilldowns) ? view.drilldowns : []).forEach((drilldown, drilldownIndex) => {
          if (!viewIds.has(drilldown?.targetView)) errors.push(`${path}.drilldowns[${drilldownIndex}].targetView must reference an existing view.`);
          if (!(Array.isArray(view.nodes) ? view.nodes : []).some(node => node?.id === drilldown?.element) && !(Array.isArray(view.participants) ? view.participants : []).includes(drilldown?.element)) errors.push(`${path}.drilldowns[${drilldownIndex}].element must be present in the view.`);
        });
      });

      if (transition) data.relationships.forEach((relationship, index) => {
        if (!changeStates.has(relationship.changeState)) return;
        const sourceState = catalogById.get(relationship.source)?.changeState;
        const targetState = catalogById.get(relationship.target)?.changeState;
        const endpointStates = [sourceState, targetState];
        if (relationship.changeState === 'unchanged' && endpointStates.some(value => value === 'added' || value === 'removed')) errors.push(`relationships[${index}] cannot be unchanged when an endpoint is added or removed.`);
        if (relationship.changeState === 'added' && endpointStates.includes('removed')) errors.push(`relationships[${index}] cannot be added to a removed endpoint.`);
        if (relationship.changeState === 'removed' && endpointStates.includes('added')) errors.push(`relationships[${index}] cannot be removed from an added endpoint.`);
      });
      return errors;
    }

    function activeView() { return state.data.views.find(view => view.id === state.activeView); }
    function viewsFor(elementId) { return state.data.views.filter(view => (view.nodes || []).some(node => node.id === elementId) || (view.participants || []).includes(elementId)); }
    function layoutFor(view) {
      const configured = view.layout || {};
      const override = state.layoutOverrides.get(view.id) || {};
      return {
        direction: override.direction || configured.direction || view.direction || 'RIGHT',
        density: override.density || configured.density || 'BALANCED',
        routing: override.routing || configured.routing || 'ORTHOGONAL'
      };
    }

    function densitySpec(layout) {
      const specs = isTransition()
        ? { COMPACT: { nodeSpacing: 64, layerSpacing: 96 }, BALANCED: { nodeSpacing: 96, layerSpacing: 120 }, SPACIOUS: { nodeSpacing: 120, layerSpacing: 156 } }
        : { COMPACT: { nodeSpacing: 30, layerSpacing: 58 }, BALANCED: { nodeSpacing: 44, layerSpacing: 80 }, SPACIOUS: { nodeSpacing: 72, layerSpacing: 120 } };
      return specs[layout.density] || specs.BALANCED;
    }

    function complexityForView(view) {
      const nodes = view.nodes || [];
      const relationships = (view.edges || []).map(id => state.relationships.get(id)).filter(Boolean);
      const labels = [
        ...nodes.map(node => displayName(state.catalog.get(node.id))),
        ...relationships.map(relationship => displayLabel(relationship))
      ];
      const parentById = new Map(nodes.map(node => [node.id, node.parent]));
      const depthOf = id => {
        let depth = 0;
        let parent = parentById.get(id);
        const seen = new Set();
        while (parent && !seen.has(parent)) {
          seen.add(parent);
          depth += 1;
          parent = parentById.get(parent);
        }
        return depth;
      };
      const maxDepth = Math.max(0, ...nodes.map(node => depthOf(node.id)));
      const maxLabelLength = Math.max(0, ...labels.map(label => label.length));
      const edgeRatio = nodes.length ? relationships.length / nodes.length : 0;
      let score = 0;
      const reasons = [];
      if (nodes.length > 35) { score += 2; reasons.push('more than 35 visible nodes'); }
      else if (nodes.length > 25) { score += 1; reasons.push('more than 25 visible nodes'); }
      if (edgeRatio > 3) { score += 2; reasons.push('more than three relationships per node'); }
      else if (edgeRatio > 2) { score += 1; reasons.push('more than two relationships per node'); }
      if (maxDepth > 2) { score += 2; reasons.push('more than two nested boundary levels'); }
      else if (maxDepth > 1) { score += 1; reasons.push('nested boundary levels'); }
      if (maxLabelLength > 70) { score += 2; reasons.push('very long labels'); }
      else if (maxLabelLength > 45) { score += 1; reasons.push('long labels'); }
      const risk = score >= 4 ? 'high' : score >= 2 ? 'medium' : 'low';
      return { risk, score, nodes: nodes.length, relationships: relationships.length, maxDepth, maxLabelLength, reasons };
    }

    function finiteRect(rect) {
      return rect && [rect.x1, rect.y1, rect.x2, rect.y2, rect.w, rect.h].every(Number.isFinite);
    }

    function rectsOverlap(left, right, inset = 0) {
      return left.x1 + inset < right.x2 - inset
        && left.x2 - inset > right.x1 + inset
        && left.y1 + inset < right.y2 - inset
        && left.y2 - inset > right.y1 + inset;
    }

    function rectGap(left, right) {
      const dx = Math.max(left.x1 - right.x2, right.x1 - left.x2, 0);
      const dy = Math.max(left.y1 - right.y2, right.y1 - left.y2, 0);
      return Math.hypot(dx, dy);
    }

    function segmentIntersectsRect(start, end, rect, inset = 1) {
      const bounds = {
        x1: rect.x1 + inset,
        y1: rect.y1 + inset,
        x2: rect.x2 - inset,
        y2: rect.y2 - inset
      };
      if (bounds.x1 >= bounds.x2 || bounds.y1 >= bounds.y2) return false;
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      let minimum = 0;
      let maximum = 1;
      for (const [p, q] of [[-dx, start.x - bounds.x1], [dx, bounds.x2 - start.x], [-dy, start.y - bounds.y1], [dy, bounds.y2 - start.y]]) {
        if (Math.abs(p) < 1e-9) {
          if (q < 0) return false;
          continue;
        }
        const ratio = q / p;
        if (p < 0) minimum = Math.max(minimum, ratio);
        else maximum = Math.min(maximum, ratio);
        if (minimum > maximum) return false;
      }
      return true;
    }

    function relationshipLabelRect(edge) {
      // Cytoscape's label-only public box collapses for a degenerate taxi midpoint;
      // the pinned 3.34.2 renderer retains the measured box used to paint the label.
      edge.boundingBox({ useCache: false, includeNodes: false, includeEdges: false, includeLabels: true, includeMainLabels: true, includeSourceLabels: false, includeTargetLabels: false, includeOverlays: false, includeUnderlays: false });
      const bounds = edge?._private?.labelBounds;
      const rect = finiteRect(bounds?.mainRot) ? bounds.mainRot : bounds?.main;
      return finiteRect(rect) ? { x1: rect.x1, y1: rect.y1, x2: rect.x2, y2: rect.y2, w: rect.w, h: rect.h } : null;
    }

    function geometryForGraph(view = activeView()) {
      if (!state.cy || view?.renderer !== 'graph') return null;
      const cy = state.cy;
      const layout = layoutFor(view);
      const issues = [];
      const suggestions = {
        'node-overlap': 'Shorten displayName values or switch to a more spacious direction/density.',
        'node-clearance': 'Increase density spacing or split the view into an overview and focused detail.',
        'label-node-overlap': 'Shorten displayLabel values, move the relationship, or use orthogonal routing.',
        'label-label-overlap': 'Shorten displayLabel values or switch direction/routing.',
        'label-geometry-unavailable': 'Retry the layout before export; if it persists, inspect the exact PNG manually.',
        'route-direction': 'Use the configured layout direction when generating the view.',
        'edge-node-obstruction': 'Use orthogonal routing or remove unrelated nodes from this focused view.',
        'edge-label-obstruction': 'Shorten relationship display labels or use orthogonal routing.',
        'viewport-overflow': 'Fit the graph again or reduce density before exporting.',
        'edge-endpoints-unavailable': 'Retry the layout and verify that both edge endpoints are visible.'
      };
      const issue = (code, severity, subject, message) => issues.push({ code, severity, subject, message, suggestion: suggestions[code] || 'Inspect the view geometry and adjust its layout preferences.' });
      const leafNodes = cy.nodes(':visible').filter(node => !node.isParent()).map(node => ({
        id: node.id(),
        rect: node.boundingBox({ includeLabels: true, includeOverlays: false, includeUnderlays: false })
      })).filter(node => finiteRect(node.rect));

      for (let leftIndex = 0; leftIndex < leafNodes.length; leftIndex += 1) {
        for (let rightIndex = leftIndex + 1; rightIndex < leafNodes.length; rightIndex += 1) {
          const left = leafNodes[leftIndex];
          const right = leafNodes[rightIndex];
          if (rectsOverlap(left.rect, right.rect)) {
            issue('node-overlap', 'error', { nodes: [left.id, right.id] }, `Nodes ${left.id} and ${right.id} overlap.`);
          } else {
            const gap = rectGap(left.rect, right.rect);
            if (gap < 8) issue('node-clearance', 'warning', { nodes: [left.id, right.id] }, `Nodes ${left.id} and ${right.id} have only ${gap.toFixed(1)}px clearance.`);
          }
        }
      }

      const labeledEdges = cy.edges(':visible').filter(edge => String(edge.data('label') || '').trim());
      const labels = labeledEdges.map(edge => ({
        id: edge.id(),
        rect: relationshipLabelRect(edge)
      })).filter(label => label.rect && label.rect.w > 0 && label.rect.h > 0);
      if (labels.length !== labeledEdges.length) {
        issue('label-geometry-unavailable', 'error', { expected: labeledEdges.length, measured: labels.length }, `Rendered bounds are unavailable for ${labeledEdges.length - labels.length} relationship label(s).`);
      }

      for (const label of labels) {
        for (const node of leafNodes) {
          if (rectsOverlap(label.rect, node.rect, 1)) {
            issue('label-node-overlap', 'error', { relationship: label.id, node: node.id }, `Relationship ${label.id} label overlaps node ${node.id}.`);
          } else {
            const gap = rectGap(label.rect, node.rect);
            if (gap < 4) issue('label-node-clearance', 'warning', { relationship: label.id, node: node.id }, `Relationship ${label.id} label has only ${gap.toFixed(1)}px clearance from node ${node.id}.`);
          }
        }
      }
      for (let leftIndex = 0; leftIndex < labels.length; leftIndex += 1) {
        for (let rightIndex = leftIndex + 1; rightIndex < labels.length; rightIndex += 1) {
          const left = labels[leftIndex];
          const right = labels[rightIndex];
          if (rectsOverlap(left.rect, right.rect, 1)) {
            issue('label-label-overlap', 'error', { relationships: [left.id, right.id] }, `Relationship labels ${left.id} and ${right.id} overlap.`);
          } else {
            const gap = rectGap(left.rect, right.rect);
            if (gap < 4) issue('label-label-clearance', 'warning', { relationships: [left.id, right.id] }, `Relationship labels ${left.id} and ${right.id} have only ${gap.toFixed(1)}px clearance.`);
          }
        }
      }

      const straightEdges = [];
      const expectedTaxiDirection = layout.direction === 'DOWN' ? 'downward' : 'rightward';
      for (const edge of cy.edges(':visible')) {
        const curve = edge.style('curve-style');
        if (curve === 'taxi' && edge.style('taxi-direction') !== expectedTaxiDirection) {
          issue('route-direction', 'error', { relationship: edge.id(), expected: expectedTaxiDirection, actual: edge.style('taxi-direction') }, `Relationship ${edge.id()} uses ${edge.style('taxi-direction')} taxi routing instead of ${expectedTaxiDirection}.`);
        }
        const start = edge.sourceEndpoint();
        const end = edge.targetEndpoint();
        if (![start?.x, start?.y, end?.x, end?.y].every(Number.isFinite)) {
          issue('edge-endpoints-unavailable', 'error', { relationship: edge.id() }, `Relationship ${edge.id()} has invalid rendered endpoints.`);
          continue;
        }
        if (curve !== 'straight') continue;
        const path = { id: edge.id(), source: edge.source().id(), target: edge.target().id(), start, end };
        straightEdges.push(path);
        for (const node of leafNodes) {
          if (node.id === path.source || node.id === path.target) continue;
          if (segmentIntersectsRect(start, end, node.rect)) {
            issue('edge-node-obstruction', 'error', { relationship: path.id, node: node.id }, `Straight relationship ${path.id} crosses node ${node.id}.`);
          }
        }
      }
      for (const path of straightEdges) {
        for (const label of labels) {
          if (label.id === path.id) continue;
          if (segmentIntersectsRect(path.start, path.end, label.rect, 0)) {
            issue('edge-label-obstruction', 'error', { relationship: path.id, labelRelationship: label.id }, `Straight relationship ${path.id} crosses the label for ${label.id}.`);
          }
        }
      }

      const content = cy.elements(':visible').renderedBoundingBox({ includeLabels: true, includeOverlays: false, includeUnderlays: false });
      const viewport = { width: cy.width(), height: cy.height() };
      if (finiteRect(content) && (content.x1 < -1 || content.y1 < -1 || content.x2 > viewport.width + 1 || content.y2 > viewport.height + 1)) {
        issue('viewport-overflow', 'error', { content, viewport }, 'The fitted graph extends outside the visible canvas.');
      }

      const errors = issues.filter(item => item.severity === 'error').length;
      const warnings = issues.filter(item => item.severity === 'warning').length;
      return {
        status: errors ? 'failed' : warnings ? 'warnings' : 'passed',
        errors,
        warnings,
        routeCoverage: layout.routing === 'STRAIGHT' ? 'exact-straight-segments' : 'taxi-endpoints-and-labels-only',
        limitations: layout.routing === 'STRAIGHT' ? [] : ['Cytoscape taxi bend points are not exposed, so taxi segment obstruction, corridor, and route-rhythm checks remain pending visual inspection.'],
        metrics: { leafNodes: leafNodes.length, labels: labels.length, straightEdges: straightEdges.length },
        issues
      };
    }

    function geometryStatusText(report) {
      if (!report) return '';
      if (report.errors) return `${report.errors} geometry error${report.errors === 1 ? '' : 's'}`;
      if (report.warnings) return `${report.warnings} geometry warning${report.warnings === 1 ? '' : 's'}`;
      return 'geometry checks passed';
    }

    function drilldownsFor(elementId) {
      return (activeView()?.drilldowns || []).filter(drilldown => drilldown.element === elementId);
    }

    function evidenceLink(evidence) {
      const visible = `${evidence.path}:${evidence.line || 1}`;
      const absolute = `${state.data.meta.repositoryRoot}/${evidence.path}`.replaceAll('\\', '/');
      const href = encodeURI(`vscode://file/${absolute}:${evidence.line || 1}:1`);
      return `<div class="evidence-card"><a class="source-link" href="${href}" title="Open in VS Code">${escapeHtml(visible)}</a><div class="evidence-note">${escapeHtml(evidence.note || '')}</div></div>`;
    }

    function backNavigation() {
      const target = state.data.views.find(view => view.id === activeView()?.backView);
      return target ? `<button class="details-action" data-view="${escapeHtml(target.id)}">Back to ${escapeHtml(target.label)}</button>` : '';
    }

    function renderWelcome() {
      const sequence = activeView()?.renderer === 'sequence';
      const notation = isTransition()
        ? '<h3>Change notation</h3><p><strong>+ Added</strong> · <strong>~ Modified</strong> · <strong>− Removed</strong> · <strong>· Context</strong>. Change owns colour; <strong>?</strong> marks inference and <strong>!</strong> marks conflicting evidence.</p>'
        : '<h3>Evidence notation</h3><p><strong>● Observed</strong> in source/configuration · <strong>◆ Documented</strong> intent · <strong>? Inferred</strong> from incomplete evidence · <strong>! Conflict</strong> where evidence does not yield one answer.</p>';
      const interaction = sequence
        ? '<h2>Select a participant</h2><p>The sequence is a disposable projection of repository evidence. Use the participant buttons to inspect shared architecture elements.</p>'
        : '<h2>Select an element or relationship</h2><p>The graph is a disposable projection of repository evidence. Dragging changes this session only. Double-click a boundary to collapse it.</p>';
      const backAction = backNavigation();
      byId('details').innerHTML = `<div class="details-kicker">How to read this</div>${interaction}${notation}${backAction}`;
    }

    function changeBadge(item) {
      if (!isTransition() || !item.changeState) return '';
      return `<span class="badge ${escapeHtml(item.changeState)}">${changeMark[item.changeState]} ${changeLabel[item.changeState]}</span>`;
    }

    function renderItemDetails(item) {
      state.selectedId = item.id;
      const appearances = viewsFor(item.id).map(view => view.label).join(', ');
      const responsibilities = (item.responsibilities || []).map(value => `<li>${escapeHtml(value)}</li>`).join('');
      const evidence = (item.evidence || []).map(evidenceLink).join('') || '<p>No direct evidence attached.</p>';
      const isGroup = ['Boundary', 'Deployment Node'].includes(item.kind);
      const drilldownActions = drilldownsFor(item.id).map(drilldown => {
        const target = state.data.views.find(view => view.id === drilldown.targetView);
        return `<button class="details-action" data-view="${escapeHtml(drilldown.targetView)}">${escapeHtml(drilldown.label || `Open ${target?.label || 'detail view'}`)}</button>`;
      }).join('');
      const backAction = backNavigation();
      byId('details').innerHTML = `<div class="details-kicker">${escapeHtml(item.kind)}</div><h2>${escapeHtml(fullName(item))}</h2>${item.displayName ? `<p class="details-id">Display label: ${escapeHtml(item.displayName)}</p>` : ''}<div class="details-id">${escapeHtml(item.id)}</div><div class="badges">${changeBadge(item)}<span class="badge ${escapeHtml(item.evidenceState)}">${stateMark[item.evidenceState]} ${escapeHtml(item.evidenceState)}</span><span class="badge">${escapeHtml(item.confidence)} confidence</span>${item.scope ? `<span class="badge">${escapeHtml(item.scope)}</span>` : ''}</div><p>${escapeHtml(item.description || '')}</p>${item.technology ? `<h3>Technology</h3><p>${escapeHtml(item.technology)}</p>` : ''}${responsibilities ? `<h3>Responsibilities</h3><ul>${responsibilities}</ul>` : ''}<h3>Shared identity</h3><p>Appears in: ${escapeHtml(appearances || 'this view only')}.</p><h3>Evidence</h3><div class="evidence-list">${evidence}</div>${isGroup ? `<button class="details-action" data-collapse="${escapeHtml(item.id)}">${state.collapsed.has(item.id) ? 'Expand' : 'Collapse'} this boundary</button>` : ''}${drilldownActions}${backAction}`;
    }

    function renderRelationshipDetails(relationship) {
      state.selectedId = relationship.id;
      const source = state.catalog.get(relationship.source);
      const target = state.catalog.get(relationship.target);
      const evidence = (relationship.evidence || []).map(evidenceLink).join('') || '<p>No direct evidence attached.</p>';
      const backAction = backNavigation();
      byId('details').innerHTML = `<div class="details-kicker">Directed relationship</div><h2>${escapeHtml(fullLabel(relationship))}</h2>${relationship.displayLabel ? `<p class="details-id">Display label: ${escapeHtml(relationship.displayLabel)}</p>` : ''}<div class="details-id">${escapeHtml(relationship.id)}</div><div class="badges">${changeBadge(relationship)}<span class="badge ${escapeHtml(relationship.evidenceState)}">${stateMark[relationship.evidenceState]} ${escapeHtml(relationship.evidenceState)}</span><span class="badge">${escapeHtml(relationship.confidence)} confidence</span>${relationship.emphasis ? `<span class="badge">${escapeHtml(relationship.emphasis)}</span>` : ''}</div><p><strong>${escapeHtml(fullName(source))}</strong> → <strong>${escapeHtml(fullName(target))}</strong></p>${relationship.technology ? `<h3>Mechanism / protocol</h3><p>${escapeHtml(relationship.technology)}</p>` : ''}${relationship.explanation ? `<h3>Why this is marked ${escapeHtml(relationship.evidenceState)}</h3><p>${escapeHtml(relationship.explanation)}</p>` : ''}<h3>Evidence</h3><div class="evidence-list">${evidence}</div>${backAction}`;
    }

    function palette() {
      const styles = getComputedStyle(document.documentElement);
      return Object.fromEntries(['paper', 'paper-raised', 'ink', 'muted', 'line', 'line-strong', 'accent', 'accent-soft', 'observed', 'documented', 'inferred', 'conflict', 'added', 'modified', 'removed', 'unchanged', 'unchanged-text', 'body', 'display', 'mono'].map(name => [name, styles.getPropertyValue(`--${name}`).trim()]));
    }

    function escapeSvg(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[character]));
    }

    function wrapText(value, maxCharacters, maxLines) {
      const words = String(value ?? '').trim().split(/\s+/).filter(Boolean);
      const lines = [];
      let line = '';
      for (const word of words) {
        const candidate = line ? `${line} ${word}` : word;
        if (line && candidate.length > maxCharacters && lines.length < maxLines - 1) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      }
      if (line) lines.push(line);
      if (lines.length > maxLines) {
        lines.length = maxLines;
        lines[maxLines - 1] = `${lines[maxLines - 1].slice(0, Math.max(1, maxCharacters - 1)).trimEnd()}…`;
      }
      return lines;
    }

    function structuredNodeImage(item, colors) {
      const kind = item.kind.toUpperCase();
      const transition = isTransition();
      const displayState = transition ? changeLabel[item.changeState].toUpperCase() : item.evidenceState.toUpperCase();
      const displayMark = transition ? changeMark[item.changeState] : stateMark[item.evidenceState];
      const kindIcon = kindMark[item.kind] || '◆';
      const nameLines = wrapText(displayName(item), 25, 2);
      const technologyLines = item.technology ? wrapText(item.technology, 34, 2) : [];
      const nameStart = technologyLines.length ? 48 - ((nameLines.length - 1) * 7) : 53 - ((nameLines.length - 1) * 7);
      const nameMarkup = nameLines.map((line, index) => `<tspan x="95" dy="${index ? 14 : 0}">${escapeSvg(line)}</tspan>`).join('');
      const technologyMarkup = technologyLines.map((line, index) => `<tspan x="95" dy="${index ? 10 : 0}">${escapeSvg(line)}</tspan>`).join('');
      const stateColor = transition && item.changeState === 'unchanged' ? colors['unchanged-text'] : colors[transition ? item.changeState : item.evidenceState] || colors.muted;
      const evidenceException = transition && ['inferred', 'conflict'].includes(item.evidenceState) ? `${stateMark[item.evidenceState]} ` : '';
      const nameColor = transition && item.changeState === 'unchanged' ? colors.muted : colors.ink;
      const bodyFont = escapeSvg(colors.body);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="190" height="92" viewBox="0 0 190 92">
        <text x="12" y="16" fill="${escapeSvg(colors.muted)}" font-family="${bodyFont}" font-size="8" font-weight="700" letter-spacing=".7"><tspan fill="${escapeSvg(transition && item.evidenceState === 'conflict' ? colors.conflict : transition && item.evidenceState === 'inferred' ? colors.inferred : colors.accent)}">${escapeSvg(evidenceException || kindIcon)}</tspan><tspan dx="4">${escapeSvg(kind)}</tspan></text>
        <text x="178" y="16" text-anchor="end" fill="${escapeSvg(stateColor)}" font-family="${bodyFont}" font-size="8" font-weight="700" letter-spacing=".6">${escapeSvg(displayMark)} ${escapeSvg(displayState)}</text>
        <text x="95" y="${nameStart}" text-anchor="middle" fill="${escapeSvg(nameColor)}" font-family="${bodyFont}" font-size="11" font-weight="700">${nameMarkup}</text>
        ${transition && item.changeState === 'removed' ? `<line x1="28" y1="53" x2="162" y2="53" stroke="${escapeSvg(colors.removed)}" stroke-width="1.5"/>` : ''}
        ${technologyLines.length ? `<text x="95" y="76" text-anchor="middle" fill="${escapeSvg(colors.muted)}" font-family="${bodyFont}" font-size="8.5" font-style="italic">${technologyMarkup}</text>` : ''}
      </svg>`;
      return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
    }

    function graphElements(view, layout = layoutFor(view)) {
      const transition = isTransition();
      const nodes = view.nodes.map(reference => {
        const item = state.catalog.get(reference.id);
        const colors = palette();
        const isStructured = !['Boundary', 'Deployment Node'].includes(item.kind);
        const evidenceException = transition && ['inferred', 'conflict'].includes(item.evidenceState) ? ` · ${stateMark[item.evidenceState]}` : '';
        const stateLine = transition ? `${changeMark[item.changeState]} ${changeLabel[item.changeState].toUpperCase()}${evidenceException}` : `${stateMark[item.evidenceState]} ${item.evidenceState.toUpperCase()}`;
        return { data: { id: item.id, parent: reference.parent, name: displayName(item), label: isStructured ? '' : `${kindMark[item.kind] ? `${kindMark[item.kind]} ` : ''}${displayName(item)}\n${item.kind.toUpperCase()}${item.technology ? ` · ${item.technology}` : ''}\n${stateLine}`, backgroundImage: isStructured ? structuredNodeImage(item, colors) : 'none', kind: item.kind, evidenceState: item.evidenceState, changeState: item.changeState || '', external: item.scope === 'External' ? 'yes' : 'no' } };
      });
      const edges = view.edges.map(id => {
        const relationship = state.relationships.get(id);
        const evidenceSuffix = transition ? (['inferred', 'conflict'].includes(relationship.evidenceState) ? ` · ${stateMark[relationship.evidenceState]}` : '') : (relationship.evidenceState === 'observed' ? '' : ` · ${stateMark[relationship.evidenceState]} ${relationship.evidenceState}`);
        return { data: { id: relationship.id, source: relationship.source, target: relationship.target, label: `${displayLabel(relationship)}${relationship.technology ? `\n${relationship.technology}` : ''}${evidenceSuffix}`, evidenceState: relationship.evidenceState, changeState: relationship.changeState || '', emphasis: relationship.emphasis || 'normal', taxiDirection: layout.direction === 'DOWN' ? 'downward' : 'rightward' } };
      });
      return [...nodes, ...edges];
    }

    function cytoscapeStyle(layout = { routing: 'ORTHOGONAL' }) {
      const p = palette();
      const edgeCurve = layout.routing === 'STRAIGHT' ? 'straight' : 'taxi';
      const styles = [
        { selector: 'node', style: { 'shape': 'round-rectangle', 'width': 190, 'height': 92, 'background-color': p['paper-raised'], 'border-color': p['line-strong'], 'border-width': 2, 'label': 'data(label)', 'color': p.ink, 'font-family': p.body, 'font-size': 10, 'font-weight': 600, 'text-wrap': 'wrap', 'text-max-width': 170, 'text-valign': 'center', 'text-halign': 'center', 'background-image': 'data(backgroundImage)', 'background-fit': 'contain', 'background-clip': 'node', 'overlay-opacity': 0 } },
        { selector: 'node[kind = "Person"]', style: { 'shape': 'ellipse', 'width': 118, 'height': 92 } },
        { selector: 'node[kind = "Data Store"]', style: { 'shape': 'barrel' } },
        { selector: 'node[kind = "Boundary"], node[kind = "Deployment Node"]', style: { 'shape': 'round-rectangle', 'padding': 30, 'background-color': p['accent-soft'], 'background-opacity': .28, 'border-color': p['line-strong'], 'border-width': 1, 'border-style': 'dashed', 'label': 'data(name)', 'font-family': p.display, 'font-size': 13, 'font-weight': 700, 'text-valign': 'top', 'text-halign': 'left', 'text-margin-x': 7, 'text-margin-y': 8, 'compound-sizing-wrt-labels': 'include' } },
        { selector: 'node[external = "yes"]', style: { 'border-style': 'dotted', 'border-width': 4 } },
        { selector: 'edge', style: { 'curve-style': edgeCurve, 'taxi-direction': 'data(taxiDirection)', 'taxi-turn': '50%', 'width': 1.6, 'line-color': p['line-strong'], 'target-arrow-color': p['line-strong'], 'target-arrow-shape': 'triangle', 'arrow-scale': .9, 'label': 'data(label)', 'color': p.muted, 'font-size': 9, 'font-family': p.body, 'text-wrap': 'wrap', 'text-max-width': 130, 'text-background-color': p.paper, 'text-background-opacity': .94, 'text-background-padding': 3, 'edge-text-rotation': 'autorotate', 'overlay-opacity': 0 } },
      ];
      if (isTransition()) styles.push(
        { selector: 'node[changeState = "added"]', style: { 'border-color': p.added, 'border-width': 4 } },
        { selector: 'node[changeState = "modified"]', style: { 'border-color': p.modified, 'border-width': 4 } },
        { selector: 'node[changeState = "removed"]', style: { 'border-color': p.removed, 'border-style': 'dashed', 'border-width': 3, 'opacity': .66 } },
        { selector: 'node[changeState = "unchanged"]', style: { 'border-color': p.unchanged, 'border-width': 1.3 } },
        { selector: 'edge[changeState = "added"]', style: { 'line-color': p.added, 'target-arrow-color': p.added, 'width': 3 } },
        { selector: 'edge[changeState = "modified"]', style: { 'line-color': p.modified, 'target-arrow-color': p.modified, 'width': 3 } },
        { selector: 'edge[changeState = "removed"]', style: { 'line-color': p.removed, 'target-arrow-color': p.removed, 'line-style': 'dashed', 'width': 2.5, 'opacity': .66 } },
        { selector: 'edge[changeState = "unchanged"]', style: { 'line-color': p.unchanged, 'target-arrow-color': p.unchanged, 'width': 1.2, 'opacity': .62 } }
      );
      else styles.push(
        { selector: 'node[evidenceState = "inferred"]', style: { 'border-color': p.inferred, 'border-style': 'dashed' } },
        { selector: 'node[evidenceState = "conflict"]', style: { 'border-color': p.conflict, 'border-style': 'double', 'border-width': 5 } },
        { selector: 'node[evidenceState = "documented"]', style: { 'border-color': p.documented } },
        { selector: 'edge[evidenceState = "inferred"]', style: { 'line-style': 'dashed', 'line-color': p.inferred, 'target-arrow-color': p.inferred } },
        { selector: 'edge[evidenceState = "conflict"]', style: { 'line-style': 'dotted', 'width': 4, 'line-color': p.conflict, 'target-arrow-color': p.conflict } }
      );
      styles.push(
        { selector: 'edge[emphasis = "muted"]', style: { 'opacity': .32 } },
        { selector: 'edge[emphasis = "hero"]', style: { 'width': 5, 'arrow-scale': 1.18, 'z-index': 10, 'opacity': 1, 'font-weight': 700, 'color': p.ink, 'text-margin-y': -54, 'text-background-opacity': 1 } },
        { selector: 'node:selected', style: { 'border-color': p.accent, 'border-width': 5 } },
        { selector: 'edge:selected', style: { 'underlay-color': p.accent, 'underlay-opacity': .38, 'underlay-padding': 7 } },
        { selector: '.dimmed', style: { 'opacity': .1, 'text-opacity': .1 } },
        { selector: '.search-match', style: { 'border-color': p.accent, 'border-width': 6, 'z-index': 99 } },
        { selector: '.collapsed', style: { 'background-opacity': .7, 'border-width': 3 } }
      );
      return styles;
    }

    function runLayout() {
      const view = activeView();
      if (!state.cy || view.renderer !== 'graph') return;
      const revision = beginRender();
      const cy = state.cy;
      const layout = layoutFor(view);
      const spacing = densitySpec(layout);
      const complexity = complexityForView(view);
      state.complexityReports.set(view.id, complexity);
      state.cy.style(cytoscapeStyle(layout));
      cy.edges().data('taxiDirection', layout.direction === 'DOWN' ? 'downward' : 'rightward');
      byId('status').textContent = 'ELK is arranging semantic layers…';
      state.cy.layout({
        name: 'elk', fit: true, padding: 45, animate: false, nodeDimensionsIncludeLabels: true,
        elk: { 'algorithm': 'layered', 'elk.direction': layout.direction, 'elk.edgeRouting': layout.routing === 'STRAIGHT' ? 'POLYLINE' : 'ORTHOGONAL', 'elk.hierarchyHandling': 'INCLUDE_CHILDREN', 'elk.spacing.nodeNode': String(spacing.nodeSpacing), 'elk.layered.spacing.nodeNodeBetweenLayers': String(spacing.layerSpacing), 'elk.padding': '[top=48,left=36,bottom=36,right=36]' },
        stop: () => {
          if (cy !== state.cy || !finishRender(revision)) return;
          const geometry = geometryForGraph(view);
          byId('status').textContent = `ELK layout · ${state.cy.nodes(':visible').length} visible elements · ${complexity.risk} complexity · ${geometryStatusText(geometry)}`;
          const complexityTitle = complexity.reasons.length ? `Advisory complexity signals: ${complexity.reasons.join('; ')}.` : 'No advisory complexity signals.';
          const geometryTitle = geometry?.issues.length ? ` Geometry: ${geometry.issues.map(item => item.message).join(' ')}` : '';
          byId('status').title = `${complexityTitle}${geometryTitle}`;
        }
      }).run();
    }

    function renderGraph(view) {
      byId('graph').hidden = false;
      byId('sequence').hidden = true;
      state.cy?.destroy();
      const layout = layoutFor(view);
      state.cy = cytoscape({ container: byId('graph'), elements: graphElements(view, layout), style: cytoscapeStyle(layout), minZoom: .16, maxZoom: 3.2, boxSelectionEnabled: true, selectionType: 'single' });
      state.cy.on('tap', 'node', event => renderItemDetails(state.catalog.get(event.target.id())));
      state.cy.on('tap', 'edge', event => renderRelationshipDetails(state.relationships.get(event.target.id())));
      state.cy.on('tap', event => { if (event.target === state.cy) { state.selectedId = null; renderWelcome(); } });
      state.cy.on('dbltap', 'node[kind = "Boundary"], node[kind = "Deployment Node"]', event => toggleGroup(event.target.id()));
      runLayout();
      restoreCollapsed();
      applyFilters();
    }

    function mermaidConfig() {
      const p = palette();
      return {
        startOnLoad: false,
        securityLevel: 'loose',
        theme: 'base',
        themeVariables: {
          background: p.paper,
          primaryColor: p['paper-raised'],
          primaryTextColor: p.ink,
          primaryBorderColor: p['line-strong'],
          secondaryColor: p['accent-soft'],
          tertiaryColor: p.paper,
          lineColor: p['line-strong'],
          actorBkg: p['paper-raised'],
          actorBorder: p['line-strong'],
          actorTextColor: p.ink,
          actorLineColor: p['line-strong'],
          signalColor: p.ink,
          signalTextColor: p.ink,
          labelBoxBkgColor: p.paper,
          labelBoxBorderColor: p['line-strong'],
          labelTextColor: p.ink,
          loopTextColor: p.muted,
          noteBkgColor: p['accent-soft'],
          noteBorderColor: p.accent,
          noteTextColor: p.ink,
          activationBkgColor: p['accent-soft'],
          activationBorderColor: p.accent,
          fontFamily: p.body
        },
        sequence: { useMaxWidth: false, diagramMarginX: 32, actorMargin: 60, messageMargin: 38 }
      };
    }

    function sequenceSafeText(value) {
      return String(value ?? '').replace(/\r?\n/g, ' ').replace(/[\u0000-\u001f]/g, ' ').replace(/[<>[\]{}"`]/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function sequenceAlias(raw, aliases, view) {
      const value = String(raw || '').trim();
      if (!value) return 'participant';
      if (aliases.has(value)) return aliases.get(value);
      const normalized = value.toLowerCase();
      const matchedId = view.participants.find(id => {
        const item = state.catalog.get(id);
        return [id, id.split(':').pop(), item?.name, item?.displayName].filter(Boolean).some(candidate => String(candidate).toLowerCase() === normalized);
      });
      if (matchedId && aliases.has(matchedId)) {
        aliases.set(value, aliases.get(matchedId));
        return aliases.get(matchedId);
      }
      const alias = `p${Math.max(1, [...new Set(aliases.values())].length + 1)}`;
      aliases.set(value, alias);
      if (matchedId) {
        const item = state.catalog.get(matchedId);
        [matchedId, matchedId.split(':').pop(), item?.name, item?.displayName].filter(Boolean).forEach(candidate => aliases.set(String(candidate), alias));
      }
      return alias;
    }

    function sequenceItemForAlias(alias, aliases, view) {
      const id = view.participants.find(participantId => aliases.get(participantId) === alias);
      return state.catalog.get(id);
    }

    function knownSequenceParticipant(raw, aliases, view) {
      const value = String(raw || '').trim();
      if (aliases.has(value)) return true;
      const normalized = value.toLowerCase();
      return view.participants.some(id => {
        const item = state.catalog.get(id);
        return [id, id.split(':').pop(), item?.name, item?.displayName].filter(Boolean).some(candidate => String(candidate).toLowerCase() === normalized);
      });
    }

    function parseSequenceNote(line, aliases, view) {
      const match = line.match(/^(\s*Note\s+(?:over|right of|left of)\s+)(.*)$/i);
      if (!match) return null;
      for (let index = 0; index < match[2].length; index += 1) {
        if (match[2][index] !== ':') continue;
        const participants = match[2].slice(0, index).trim().split(/\s*(?:,|\band\b)\s*/i).filter(Boolean);
        if (participants.length && participants.every(participant => knownSequenceParticipant(participant, aliases, view))) {
          return { prefix: match[1], participants, label: match[2].slice(index + 1) };
        }
      }
      return null;
    }

    function prepareSequence(view) {
      const aliases = new Map();
      view.participants.forEach(id => sequenceAlias(id, aliases, view));
      const fallbackSteps = [];
      const lines = String(view.mermaid).replace(/\r\n?/g, '\n').split('\n');
      const output = lines.map((line, index) => {
        const declaration = line.match(/^(\s*)(actor|participant|boundary|control|entity|database|collections|queue)\s+([^\s]+)(?:\s+as\s+(.+?))?\s*$/i);
        if (declaration) {
          const alias = sequenceAlias(declaration[3], aliases, view);
          const item = sequenceItemForAlias(alias, aliases, view);
          const label = sequenceSafeText(declaration[4] || displayName(item) || declaration[3]);
          return `${declaration[1]}${declaration[2]} ${alias}${label ? ` as ${label}` : ''}`;
        }
        const message = line.match(/^(\s*)(.+?)(-->>|->>|-->|-x|--x|-)([+-]?[^\s]+)\s*:\s*(.*)$/);
        if (message) {
          const statement = { indent: message[1], source: message[2], arrow: message[3], target: message[4], label: message[5] };
          const source = sequenceAlias(statement.source, aliases, view);
          const activation = /^[+-]/.test(statement.target) ? statement.target[0] : '';
          const target = sequenceAlias(statement.target.replace(/^[+-]/, ''), aliases, view);
          const label = sequenceSafeText(statement.label) || 'Sends message';
          const sourceItem = sequenceItemForAlias(source, aliases, view);
          const targetItem = sequenceItemForAlias(target, aliases, view);
          fallbackSteps.push({ source: displayName(sourceItem) || statement.source, target: displayName(targetItem) || statement.target, label });
          if (source === target) return `${statement.indent}Note over ${source}: ${sequenceSafeText(`Self-message: ${label}`)}`;
          return `${statement.indent}${source}${statement.arrow}${activation}${target}: ${label}`;
        }
        const note = parseSequenceNote(line, aliases, view);
        if (note) return `${note.prefix}${note.participants.map(value => sequenceAlias(value, aliases, view)).join(', ')}: ${sequenceSafeText(note.label)}`;
        if (/^\s*(loop|alt|else|opt|par|and|critical|break)\b/i.test(line)) return line.replace(/:\s*(.*)$/, (_, value) => `: ${sequenceSafeText(value)}`);
        return line.replace(/[\u0000-\u001f]/g, ' ');
      });
      return { original: view.mermaid, source: output.join('\n'), fallbackSteps };
    }

    function mermaidFailure(error, prepared) {
      const message = String(error?.message || error || 'Unknown Mermaid error');
      const match = message.match(/(?:line|row)\s+(\d+)/i);
      const line = match ? Number(match[1]) : null;
      const sourceLines = prepared.source.split('\n');
      const excerpt = line && sourceLines[line - 1] ? `Line ${line}: ${sourceLines[line - 1]}` : 'Mermaid did not report a source line.';
      return { message, line, excerpt };
    }

    function renderSequenceFallback(view, prepared, failure) {
      const steps = prepared.fallbackSteps.length
        ? `<ol>${prepared.fallbackSteps.map(step => `<li class="fallback-step"><strong>${escapeHtml(step.source)}</strong> → <strong>${escapeHtml(step.target)}</strong>: ${escapeHtml(step.label)}</li>`).join('')}</ol>`
        : '<p>No message lines could be recovered. Use the participant controls and the source excerpt to continue the investigation.</p>';
      const source = prepared.source.split('\n').map((line, index) => `${String(index + 1).padStart(3, ' ')} ${line}`).join('\n');
      byId('sequence-diagram').innerHTML = `<section class="sequence-fallback" role="alert"><h2>Mermaid render failed</h2><p>${escapeHtml(failure.message)}</p><p><strong>${escapeHtml(failure.excerpt)}</strong></p><p>The explorer kept the original evidence and produced a readable ordered fallback. Repair the source only if a rendered diagram is required.</p>${steps}<details><summary>Show sanitized Mermaid source</summary><pre>${escapeHtml(source)}</pre></details><details><summary>Show original Mermaid evidence</summary><pre>${escapeHtml(prepared.original)}</pre></details></section>`;
    }

    async function renderSequence(view) {
      const revision = beginRender();
      state.cy?.destroy(); state.cy = null;
      byId('graph').hidden = true; byId('sequence').hidden = false;
      const strip = `<div class="participant-strip">${view.participants.map(id => `<button class="participant" data-participant="${escapeHtml(id)}">${escapeHtml(displayName(state.catalog.get(id)))}</button>`).join('')}</div>`;
      byId('sequence').innerHTML = `${strip}<div id="sequence-diagram" aria-label="${escapeHtml(view.scenario)} sequence diagram"></div>`;
      const prepared = prepareSequence(view);
      mermaid.initialize(mermaidConfig());
      try {
        const rendered = await mermaid.render(`architecture-sequence-${artifactFingerprint}-${Date.now()}`, prepared.source);
        if (revision !== renderRevision) return;
        byId('sequence-diagram').innerHTML = `${rendered.svg}<details class="sequence-source"><summary>Show original Mermaid evidence</summary><pre>${escapeHtml(prepared.original)}</pre></details>`;
        state.sequenceReports.set(view.id, { degraded: false, source: prepared.source, original: prepared.original, fallbackSteps: prepared.fallbackSteps });
        byId('status').textContent = `Mermaid sequence · ${view.participants.length} participants`;
        applyFilters();
        finishRender(revision);
      } catch (error) {
        if (revision !== renderRevision) return;
        const failure = mermaidFailure(error, prepared);
        state.sequenceReports.set(view.id, { degraded: true, ...failure, source: prepared.source, original: prepared.original, fallbackSteps: prepared.fallbackSteps });
        renderSequenceFallback(view, prepared, failure);
        byId('status').textContent = `Sequence fallback · Mermaid render failed at ${failure.line ? `line ${failure.line}` : 'an unknown line'}`;
        byId('status').title = 'The renderer failed, but the sanitized source and ordered message fallback remain available.';
        finishRender(revision);
        byId('export').disabled = true;
      }
    }

    function setGroupCollapsed(id, collapsed) {
      const group = state.cy.getElementById(id);
      const descendants = group.descendants();
      if (collapsed) {
        state.collapsed.add(id); group.addClass('collapsed');
        descendants.style('display', 'none'); descendants.connectedEdges().style('display', 'none');
      } else {
        state.collapsed.delete(id); group.removeClass('collapsed');
        descendants.style('display', 'element'); descendants.connectedEdges().style('display', 'element');
      }
    }

    // Collapsed boundaries survive re-renders (theme changes, tab switches) when the boundary exists in the new view.
    function restoreCollapsed() {
      if (!state.cy) return;
      for (const id of [...state.collapsed]) {
        if (state.cy.getElementById(id).empty()) { state.collapsed.delete(id); continue; }
        setGroupCollapsed(id, true);
      }
    }

    function toggleGroup(id) {
      if (!state.cy) return;
      setGroupCollapsed(id, !state.collapsed.has(id));
      renderItemDetails(state.catalog.get(id));
      state.cy.fit(state.cy.elements(':visible'), 45);
      byId('status').textContent = `ELK layout · ${state.cy.nodes(':visible').length} visible elements`;
    }

    function elementHaystack(item) {
      return [fullName(item), item.displayName, item.kind, item.changeState, changeLabel[item.changeState], item.technology, item.description, ...(item.responsibilities || []), ...(item.evidence || []).flatMap(e => [e.path, e.note])].join(' ').toLowerCase();
    }

    function matchesElement(element, query) {
      return !query || elementHaystack(state.catalog.get(element.id())).includes(query);
    }

    function matchesRelationship(relationship, query) {
      const haystack = [fullLabel(relationship), relationship.displayLabel, relationship.changeState, changeLabel[relationship.changeState], relationship.technology, relationship.explanation, ...(relationship.evidence || []).flatMap(e => [e.path, e.note])].join(' ').toLowerCase();
