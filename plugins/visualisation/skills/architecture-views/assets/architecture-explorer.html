      return !query || haystack.includes(query);
    }

    function applySequenceFilters() {
      const query = byId('search').value.trim().toLowerCase();
      let matches = 0;
      document.querySelectorAll('.participant').forEach(button => {
        const hit = !query || elementHaystack(state.catalog.get(button.dataset.participant)).includes(query);
        button.classList.toggle('search-match', Boolean(query) && hit);
        button.classList.toggle('dimmed', Boolean(query) && !hit);
        if (query && hit) matches += 1;
      });
      byId('search-count').textContent = query ? `${matches} match${matches === 1 ? '' : 'es'}` : '';
    }

    function applyFilters() {
      if (!state.cy) { applySequenceFilters(); return; }
      const query = byId('search').value.trim().toLowerCase();
      const evidenceState = byId('evidence-filter').value;
      const primaryNodeMatches = new Set();
      const primaryEdgeMatches = new Set();
      const contextualNodes = new Set();
      state.cy.nodes().forEach(node => {
        const item = state.catalog.get(node.id());
        if (matchesElement(node, query) && (evidenceState === 'all' || item.evidenceState === evidenceState)) primaryNodeMatches.add(node.id());
      });
      state.cy.edges().forEach(edge => {
        const relationship = state.relationships.get(edge.id());
        if (matchesRelationship(relationship, query) && (evidenceState === 'all' || relationship.evidenceState === evidenceState)) {
          primaryEdgeMatches.add(edge.id());
          contextualNodes.add(relationship.source);
          contextualNodes.add(relationship.target);
        }
      });
      state.cy.batch(() => {
        state.cy.elements().removeClass('dimmed search-match');
        state.cy.nodes().forEach(node => {
          if (primaryNodeMatches.has(node.id()) || contextualNodes.has(node.id())) { if (query && primaryNodeMatches.has(node.id())) node.addClass('search-match'); }
          else node.addClass('dimmed');
        });
        state.cy.edges().forEach(edge => {
          if (!primaryEdgeMatches.has(edge.id())) edge.addClass('dimmed');
        });
      });
      const matches = primaryNodeMatches.size + primaryEdgeMatches.size;
      byId('search-count').textContent = query || evidenceState !== 'all' ? `${matches} match${matches === 1 ? '' : 'es'}` : '';
    }

    function renderLegend(view) {
      const kinds = new Set((view.nodes || []).map(node => state.catalog.get(node.id).kind));
      if (view.renderer === 'sequence') view.participants.forEach(id => kinds.add(state.catalog.get(id).kind));
      const kindText = [...kinds].filter(kind => kind !== 'Boundary').map(kind => `<span class="legend-item"><span class="legend-mark"></span>${escapeHtml(kind)}</span>`).join('');
      if (isTransition() && view.renderer === 'graph') {
        const changeText = ['added', 'modified', 'removed', 'unchanged'].map(value => `<span class="legend-item"><span class="legend-mark ${value}"></span>${changeMark[value]} ${changeLabel[value]}</span>`).join('');
        const evidenceExceptions = ['inferred', 'conflict'].map(value => `<span class="legend-item"><span class="legend-mark ${value}" style="color:var(--${value})"></span>${stateMark[value]} ${value}</span>`).join('');
        byId('legend').innerHTML = `${kindText}<span aria-hidden="true">·</span>${changeText}<span aria-hidden="true">·</span>${evidenceExceptions}`;
        return;
      }
      const evidenceText = ['observed', 'documented', 'inferred', 'conflict'].map(value => `<span class="legend-item"><span class="legend-mark ${value}" style="color:var(--${value})"></span>${stateMark[value]} ${value}</span>`).join('');
      byId('legend').innerHTML = `${kindText}<span aria-hidden="true">·</span>${evidenceText}`;
    }

    function exportName(view) {
      const label = `${state.data.meta.title}-${view.label}`.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      state.exportCount += 1;
      return `${label || 'architecture-view'}-${state.exportRunId}-${String(state.exportCount).padStart(2, '0')}.png`;
    }

    function download(url, filename) {
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function exportSequence(view) {
      const source = byId('sequence-diagram').querySelector('svg');
      if (!source) throw new Error('The sequence diagram is not ready.');
      const copy = source.cloneNode(true);
      copy.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const box = source.viewBox?.baseVal;
      const width = Math.max(1, Math.ceil(box?.width || source.getBoundingClientRect().width));
      const height = Math.max(1, Math.ceil(box?.height || source.getBoundingClientRect().height));
      copy.setAttribute('width', width);
      copy.setAttribute('height', height);
      const svgUrl = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)], { type: 'image/svg+xml;charset=utf-8' }));
      try {
        const image = new Image();
        image.src = svgUrl;
        await image.decode();
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = width * scale;
        canvas.height = height * scale;
        const context = canvas.getContext('2d');
        context.scale(scale, scale);
        context.fillStyle = palette().paper;
        context.fillRect(0, 0, width, height);
        context.drawImage(image, 0, 0, width, height);
        const png = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!png) throw new Error('The browser could not encode the sequence diagram.');
        const pngUrl = URL.createObjectURL(png);
        download(pngUrl, exportName(view));
        setTimeout(() => URL.revokeObjectURL(pngUrl), 1000);
      } finally {
        URL.revokeObjectURL(svgUrl);
      }
    }

    async function exportActiveView() {
      if (completedRevision !== renderRevision) return;
      const view = activeView();
      const button = byId('export');
      button.disabled = true;
      byId('status').textContent = `Preparing ${view.label} PNG…`;
      try {
        if (view.renderer === 'graph') {
          if (!state.cy) throw new Error('The graph is not ready.');
          download(state.cy.png({ full: true, scale: 2, bg: palette().paper }), exportName(view));
        } else {
          await exportSequence(view);
        }
        byId('status').textContent = `${view.label} exported as a high-resolution PNG`;
      } catch (error) {
        byId('status').textContent = `PNG export failed: ${error.message || error}`;
      } finally {
        button.disabled = false;
      }
    }

    function syncLayoutControls(view, enabled) {
      const layout = layoutFor(view);
      for (const [id, name] of layoutControls) {
        const control = byId(id);
        control.value = layout[name];
        control.disabled = !enabled;
      }
    }

    function updateLayoutPreference(name, value) {
      const view = activeView();
      if (!view || view.renderer !== 'graph') return;
      const next = { ...(state.layoutOverrides.get(view.id) || {}), [name]: value };
      state.layoutOverrides.set(view.id, next);
      runLayout();
    }

    function resetView() {
      const view = activeView();
      if (!view) return;
      byId('search').value = '';
      byId('evidence-filter').value = 'all';
      state.collapsed.clear();
      state.layoutOverrides.delete(view.id);
      state.selectedId = null;
      activateView(view.id);
    }

    async function activateView(id) {
      state.activeView = id;
      const view = activeView();
      document.querySelectorAll('.tab').forEach(button => button.setAttribute('aria-selected', String(button.dataset.view === id)));
      byId('level').textContent = `C4 ${view.level}`;
      byId('perspective').textContent = view.perspective;
      byId('scenario').textContent = view.scenario || 'No scenario';
      byId('eyebrow').textContent = isTransition() ? 'Architecture exploration · ephemeral change context' : 'Architecture exploration · ephemeral evidence view';
      const comparison = byId('comparison');
      comparison.hidden = !isTransition();
      comparison.textContent = isTransition() ? (state.data.comparison.range || `${state.data.comparison.base} → ${state.data.comparison.head}`) : '';
      comparison.title = isTransition() ? `${state.data.comparison.base} → ${state.data.comparison.head}` : '';
      const graphMode = view.renderer === 'graph';
      byId('search').disabled = false;
      byId('export').disabled = false;
      for (const id of ['evidence-filter', 'fit', 'layout']) byId(id).disabled = !graphMode;
      syncLayoutControls(view, graphMode);
      if (!graphMode) { byId('evidence-filter').value = 'all'; }
      renderLegend(view);
      if (view.renderer === 'graph') renderGraph(view); else await renderSequence(view);
      if (state.selectedId && state.catalog.has(state.selectedId) && ((view.nodes || []).some(node => node.id === state.selectedId) || (view.participants || []).includes(state.selectedId))) {
        renderItemDetails(state.catalog.get(state.selectedId));
        state.cy?.getElementById(state.selectedId).select();
      } else { state.selectedId = null; renderWelcome(); }
    }

    function resolvedTheme() {
      if (state.theme !== 'auto') return state.theme;
      return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    // data-theme always carries the resolved value so the single :root[data-theme="dark"] block is the only palette.
    function applyTheme() {
      document.documentElement.dataset.theme = resolvedTheme();
      byId('theme').textContent = `Theme: ${state.theme}`;
    }

    function cycleTheme() {
      state.theme = state.theme === 'auto' ? 'light' : state.theme === 'light' ? 'dark' : 'auto';
      applyTheme();
      activateView(state.activeView);
    }

    function wireControls() {
      byId('tabs').addEventListener('click', event => { const button = event.target.closest('[data-view]'); if (button) activateView(button.dataset.view); });
      byId('search').addEventListener('input', applyFilters);
      byId('search').addEventListener('keydown', event => {
        if (event.key !== 'Enter') return;
        if (state.cy) {
          const match = state.cy.nodes('.search-match').first();
          if (match.nonempty()) { match.select(); state.cy.animate({ center: { eles: match }, zoom: 1.1 }, { duration: 220 }); renderItemDetails(state.catalog.get(match.id())); }
        } else {
          const match = document.querySelector('.participant.search-match');
          if (match) renderItemDetails(state.catalog.get(match.dataset.participant));
        }
      });
      byId('evidence-filter').addEventListener('change', applyFilters);
      byId('fit').addEventListener('click', () => state.cy?.fit(state.cy.elements(':visible'), 45));
      byId('layout').addEventListener('click', runLayout);
      for (const [id, name] of layoutControls) byId(id).addEventListener('change', event => updateLayoutPreference(name, event.target.value));
      byId('reset').addEventListener('click', resetView);
      byId('theme').addEventListener('click', cycleTheme);
      byId('export').addEventListener('click', exportActiveView);
      byId('details').addEventListener('click', event => {
        const viewButton = event.target.closest('[data-view]');
        if (viewButton) { activateView(viewButton.dataset.view); return; }
        const collapseButton = event.target.closest('[data-collapse]');
        if (collapseButton) toggleGroup(collapseButton.dataset.collapse);
      });
      byId('sequence').addEventListener('click', event => { const button = event.target.closest('[data-participant]'); if (button) renderItemDetails(state.catalog.get(button.dataset.participant)); });
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (state.theme === 'auto') { applyTheme(); activateView(state.activeView); } });
    }

    window.__architectureExplorer = {
      diagnostics: () => {
        const view = activeView();
        const complexity = view?.renderer === 'graph' ? (state.complexityReports.get(view.id) || complexityForView(view)) : null;
        return {
          ready: Boolean(state.data && view && completedRevision === renderRevision && renderRevision > 0),
          artifact: { id: state.data?.meta?.artifactId || artifactFingerprint, fingerprint: artifactFingerprint },
          failure: state.failure,
          preflightErrors,
          renderRevision,
          completedRevision,
          failureVisible: byId('failure').classList.contains('visible'),
          activeView: view?.id || null,
          renderer: view?.renderer || null,
          layout: view ? layoutFor(view) : null,
          complexity,
          geometry: view?.renderer === 'graph' ? geometryForGraph(view) : null,
          sequence: view?.renderer === 'sequence' ? (state.sequenceReports.get(view.id) || null) : null,
          visibleNodes: state.cy ? state.cy.nodes(':visible').length : 0,
          visibleEdges: state.cy ? state.cy.edges(':visible').length : 0,
          edgeRouting: state.cy ? state.cy.edges().map(edge => ({ direction: edge.data('taxiDirection'), curve: edge.style('curve-style') })) : [],
          zoom: state.cy ? state.cy.zoom() : null,
          status: byId('status').textContent,
          exportCount: state.exportCount
        };
      }
    };

    async function start() {
      let encoded;
      try {
        encoded = byId('architecture-data').textContent.trim();
        artifactFingerprint = fingerprint(encoded);
        state.data = decodeData();
      } catch (error) {
        showFailure('Architecture data could not be decoded', `<p>${escapeHtml(error.message || error)}</p><p>Return the evidence-backed prose answer and regenerate the artifact from valid UTF-8 JSON.</p>`, 'data');
        return;
      }
      preflightErrors = validate(state.data);
      if (preflightErrors.length) {
        const suggestions = preflightErrors.map(error => {
          const suggestion = /^View .* contains a compound-parent cycle/i.test(error) ? 'Flatten or reorder compound parents so boundaries form a tree.' : /^(?:Graph view|Transition graph view).*hero relationship/i.test(error) ? 'Keep one scenario-defining hero edge and make the remaining edges normal or muted.' : /^View .* (?:references unknown|relationship .* requires|parent .* must)/i.test(error) || /^Relationship .* points to an unknown element/i.test(error) ? 'Check that every referenced id is declared in the catalog and included in the same view.' : /^(?:Duplicate|View .* includes duplicate)/i.test(error) ? 'Give each catalog, relationship, view, node, and participant entry a unique id.' : 'Check the data contract in references/html-explorer.md.';
          return `<li><strong>${escapeHtml(error)}</strong><br><span>${escapeHtml(suggestion)}</span></li>`;
        }).join('');
        showFailure('Architecture data failed preflight', `<p>The explorer was not opened because the generated data is invalid.</p><ul>${suggestions}</ul>`, 'schema');
        return;
      }
      const expectedArtifact = new URLSearchParams(location.search).get('artifact');
      const enforceArtifact = new URLSearchParams(location.search).get('artifact-check') === '1';
      const loadedArtifact = artifactFingerprint;
      const artifactLabel = state.data.meta.artifactId || loadedArtifact;
      if (!expectedArtifact && history.replaceState) {
        const currentUrl = new URL(location.href);
        currentUrl.searchParams.set('artifact', loadedArtifact);
        history.replaceState(null, '', currentUrl);
      }
      if (enforceArtifact && expectedArtifact && expectedArtifact !== loadedArtifact) {
        showFailure('Stale architecture artifact', `<p>This page contains <code>${escapeHtml(artifactLabel)}</code> (<code>${escapeHtml(loadedArtifact)}</code>), but the preview requested <code>${escapeHtml(expectedArtifact)}</code>.</p><p>Reload the generated file from its current path; the content-derived identity makes stale preview content distinguishable from renderer failure.</p>`, 'stale');
        return;
      }
      const simulatedFailure = new URLSearchParams(location.search).get('fail-deps') === '1';
      const missing = [...window.__architectureDependencyErrors];
      if (!window.cytoscape) missing.push('Cytoscape.js');
      if (!window.ELK) missing.push('ELK.js');
      if (!window.mermaid) missing.push('Mermaid');
      if (simulatedFailure || missing.length) {
        const reason = simulatedFailure ? ['Simulated failure requested with ?fail-deps=1'] : [...new Set(missing)];
        showFailure('Rendering dependencies did not load', `<p>This disposable explorer needs its pinned browser libraries. Missing:</p><ul>${reason.map(value => `<li>${escapeHtml(value)}</li>`).join('')}</ul><p>Check network access or permit the dependencies, then <a href="${location.pathname}">retry without the simulation</a>. If that is not possible, return the evidence-backed prose answer—do not silently switch formats.</p>`, 'dependencies');
        return;
      }
      state.data.catalog.forEach(item => state.catalog.set(item.id, item));
      state.data.relationships.forEach(item => state.relationships.set(item.id, item));
      byId('title').textContent = state.data.meta.title;
      byId('question').textContent = state.data.meta.question;
      const primaryView = state.data.meta.primaryView || state.data.views[0].id;
      byId('tabs').innerHTML = state.data.views.map(view => `<button type="button" class="tab" role="tab" data-view="${escapeHtml(view.id)}" aria-selected="${view.id === primaryView}">${escapeHtml(view.label)}</button>`).join('');
      wireControls();
      await activateView(primaryView);
    }

    window.addEventListener('DOMContentLoaded', start);
  })();
  </script>
</body>
</html>
